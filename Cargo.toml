[package]
name = "agentgrasp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Keeps long command output out of a coding agent's context, and answers yes/no questions about files with Jev"
repository = "https://github.com/damejeras/agentgrasp"
readme = "README.md"
keywords = ["mcp", "claude", "hook", "agent", "search"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
globset = "0.4.20"
ignore = "0.4.33"
libc = "0.2.189"
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.5.0", features = ["server", "transport-io", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tree-sitter = "0.27.0"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "fs"] }
tokio-util = "0.7.19"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["process"] }
tempfile = "3.27.0"

# Runs the MCP server in a child process with a fake Jev server; see tests/mcp.rs.
[[test]]
name = "mcp"
harness = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
